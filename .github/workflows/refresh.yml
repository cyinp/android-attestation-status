name: Refresh public Android attestation status
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: public-attestation-status
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'cyinp/android-attestation-status' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check runtime
        run: |
          php -r 'exit(extension_loaded("sodium") && extension_loaded("curl") ? 0 : 1);'
      - name: Fetch official HTTPS list and sign
        env:
          ATTESTATION_SIGNING_KEY: ${{ secrets.ATTESTATION_SIGNING_KEY }}
        run: php publish.php
      - name: Commit public snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh signed public certificate status'
          git push origin HEAD:main
